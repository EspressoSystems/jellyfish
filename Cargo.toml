[workspace]
members = [
    "aead",
    "commitment",
    "crhf",
    "elgamal",
    "merkle_tree",
    "pcs",
    "plonk",
    "poseidon2",
    "prf",
    "relation",
    "rescue",
    "signature",
    "utilities",
    "vrf",
]
resolver = "2"

[workspace.package]
authors = ["Espresso Systems <hello@espressosys.com>"]
edition = "2021"
license = "MIT"
rust-version = "1.73.0"
homepage = "https://github.com/EspressoSystems/jellyfish"
documentation = "https://jellyfish.docs.espressosys.com"
repository = "https://github.com/EspressoSystems/jellyfish"

[workspace.dependencies]
ark-bls12-377 = { version = "0.6", default-features = false, features = [ "curve" ] }
ark-bls12-381 = { version = "0.6", default-features = false, features = [ "curve" ] }
ark-bn254 = { version = "0.6", default-features = false, features = [ "curve" ] }
ark-bw6-761 = { version = "0.6", default-features = false }
ark-ec = { version = "0.6", default-features = false }
ark-ed-on-bls12-377 = { version = "0.6", default-features = false }
ark-ed-on-bls12-381 = { version = "0.6", default-features = false }
ark-ed-on-bls12-381-bandersnatch = { version = "0.6", default-features = false }
ark-ed-on-bn254 = { version = "0.6", default-features = false }
ark-ff = { version = "0.6", default-features = false, features = [ "asm" ] }
ark-poly = { version = "0.6", default-features = false }
ark-serialize = { version = "0.6", default-features = false, features = [ "derive" ] }
ark-std = { version = "0.6", default-features = false }
derivative = { version = "2", features = ["use_core"] }
digest = { version = "0.10.7", default-features = false, features = [ "alloc" ] }
displaydoc = { version = "0.2", default-features = false }
hashbrown = "0.14.3"
itertools = { version = "0.12", default-features = false }
merlin = { version = "3.0.0", default-features = false }
num-bigint = { version = "0.4", default-features = false }
rand_chacha = { version = "0.3.1", default-features = false }
rayon = "1.11"
serde = { version = "1.0", default-features = false, features = [ "derive", "rc", "alloc" ] }
sha2 = { version = "0.10", default-features = false }
sha3 = { version = "0.10", default-features = false }
spongefish = { version = "0.7.4", default-features = false, features = ["ark-ff", "zeroize"] }
tagged-base64 = "0.5.0"
zeroize = { version = "^1.8" }

[profile.profiling]
inherits = "release"
debug = true

[patch.crates-io]
tagged-base64 = { git = "https://github.com/EspressoSystems/tagged-base64", branch = "ab/ark-0.6" }

# Build workspace crates against each other rather than against their
# released tags, so a change that spans crates compiles in one step.
[patch."https://github.com/EspressoSystems/jellyfish"]
jf-aead = { path = "aead" }
jf-commitment = { path = "commitment" }
jf-crhf = { path = "crhf" }
jf-elgamal = { path = "elgamal" }
jf-merkle-tree = { path = "merkle_tree" }
jf-pcs = { path = "pcs" }
jf-plonk = { path = "plonk" }
jf-poseidon2 = { path = "poseidon2" }
jf-prf = { path = "prf" }
jf-relation = { path = "relation" }
jf-rescue = { path = "rescue" }
jf-signature = { path = "signature" }
jf-utils = { path = "utilities" }
jf-vrf = { path = "vrf" }
